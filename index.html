<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Five Nights at Ramiro's</title>
    <!-- Favicon and CSS -->
    <link rel="icon" type="image/png" href="/favicon.png" />
